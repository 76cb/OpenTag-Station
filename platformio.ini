[platformio]
default_envs = wt32-sc01-plus

[env]
test_framework = unity

[env:wt32-sc01-plus]
platform = espressif32@6.13.0
board = wt32-sc01-plus
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
platform_packages =
    platformio/tool-mklittlefs@1.203.210628
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fstack-usage
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc/ui
    -DOPENTAG_ENABLE_ST25R3916B=1
    -DOPENTAG_CONFIG_SCHEMA_VERSION=3
extra_scripts =
    pre:tools/build_metadata.py
    pre:tools/precompress_web_assets.py
    post:tools/web_flasher_target.py
lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.2.27
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit NAU7802 Library@1.0.8
    bblanchon/ArduinoJson@7.4.3
    ELECHOUSE NFC-RFAL for ESP32=symlink://third_party/ELECHOUSE_ST25R3916/NFC-RFAL
    ELECHOUSE ST25R3916 for ESP32=symlink://third_party/ELECHOUSE_ST25R3916/ST25R3916_ELECHOUSE
monitor_speed = 115200
build_src_filter =
    +<*>
    -<diagnostics/shared_i2c_diagnostic.cpp>
    -<platform/rfal/esp32_rfal_platform.cpp>
    -<hardware/nfc/st25r3916b/frontend_backend.cpp>
    -<hardware/nfc/st25r3916b/service.cpp>

[env:native]
platform = native@1.2.1
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=c++17
    -Isrc
build_src_filter =
    +<application/boot_health_policy.cpp>
    +<application/device_lifecycle_gate.cpp>
    +<ota/update_manager.cpp>
    +<application/operation_registry.cpp>
    +<application/state_machine.cpp>
    +<hardware/nfc/**/*.cpp>
    +<nfc/**/*.cpp>
    +<services/scale_service.cpp>
    +<services/community_catalog.cpp>
    +<services/community_catalog_updater.cpp>
    +<services/weigh_sync.cpp>
    +<services/tag_writer_service.cpp>
    +<config/configuration_service.cpp>
    +<services/first_run_setup.cpp>
    +<network/network_policy.hpp>
    +<network/http_transport.cpp>
    +<network/miniz/miniz_tinfl.c>
    +<integrations/spoolman/spoolman_adapter.cpp>
    +<integrations/filabridge/filabridge_adapter.cpp>
    +<services/spool_identity_resolver.cpp>
    +<services/toolhead_assignment_service.cpp>
    +<services/material_compatibility_service.cpp>
    +<services/station_workflow.cpp>
    +<logging/bounded_log.cpp>
    +<diagnostics/shared_i2c_diagnostic.cpp>
    +<web/idempotency_ledger.cpp>
    +<web/api_router.cpp>
    +<web/configuration_patch.cpp>
test_build_src = yes

[env:native-writer-sanitized]
extends = env:native
test_filter =
    test_tag_writer
    test_weigh_sync
    test_touch_flow
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
