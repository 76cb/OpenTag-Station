name: Production release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: python tools/release_version.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: opentag-production-release
          path: release
      - name: Verify tagged source and downloaded production files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/release_version.py --tag "$RELEASE_TAG"
          python tools/verify_release_artifacts.py release
          (cd release && sha256sum --check SHA256SUMS)
      - name: Publish accepted production version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --title "OpenTag Station $RELEASE_TAG" --notes-file CHANGELOG.md release/*
