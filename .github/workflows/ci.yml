name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check out pinned OpenPrintTag reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: OpenPrintTag/openprinttag-specification
          ref: 7e09cc38df1c8e7824a67f5b1ae93071f52519ad
          path: .reference/openprinttag-specification
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --requirement .reference/openprinttag-specification/requirements.txt
      - run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
      - run: python tools/verify_openprinttag_initializer_reference.py --spec-root .reference/openprinttag-specification
      - run: python tools/check_web_assets.py
      - run: node --test tools/test_web_transport.mjs
      - run: python tools/web_flasher.py validate-source --page web-flasher/index.html --manifest web-flasher/manifest.json --diagnostic-manifest web-flasher/i2c-test-manifest.json
      - run: pio test --environment native
      - run: python tools/check_production_nfc.py
      - run: pio run --environment wt32-sc01-plus
      - run: python tools/check_production_nfc.py --elf
      - run: pio run --environment wt32-sc01-plus-i2c-test
      - run: python tools/analyze_stack_usage.py
      - run: python tools/analyze_stack_usage.py .pio/build/wt32-sc01-plus-i2c-test
      - run: python tools/check_diagnostic_stack_usage.py
      - run: python tools/check_diagnostic_http_stack_usage.py
      - run: python tools/check_production_nfc_stack_usage.py
      - run: python tools/check_production_http_stack_usage.py
      - run: pio run --environment wt32-sc01-plus --target web-flasher
      - run: python tools/web_flasher.py validate-bundle --bundle-dir .pio/build/wt32-sc01-plus/web-flasher --maximum-size 16777216
      - run: pio run --environment wt32-sc01-plus-i2c-test --target web-flasher
      - run: python tools/web_flasher.py validate-bundle --kind diagnostic --bundle-dir .pio/build/wt32-sc01-plus-i2c-test/web-flasher --maximum-size 16777216
      - name: Upload PR NFC-V diagnostic bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentag-nfc-v-diagnostic-pr
          path: .pio/build/wt32-sc01-plus-i2c-test/web-flasher
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload PR production NFC bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentag-production-nfc-pr
          path: .pio/build/wt32-sc01-plus/web-flasher
          if-no-files-found: error
          include-hidden-files: true
      - run: python tools/web_flasher.py assemble-pages --factory-bundle .pio/build/wt32-sc01-plus/web-flasher --diagnostic-bundle .pio/build/wt32-sc01-plus-i2c-test/web-flasher --output-dir .pio/build/web-flasher-pages --maximum-size 16777216
      - run: python tools/web_flasher.py validate-pages --bundle-dir .pio/build/web-flasher-pages --maximum-size 16777216
